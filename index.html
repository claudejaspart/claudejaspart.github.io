<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>

            * {box-sizing: border-box}
            
            body 
            {
                font-family: "Lato", sans-serif;
                background-color: #555;
                
            }

            /* Style the tab */
            .tab 
            {
                float: left;
                border: 1px solid #ccc;
                background-color: #f1f1f1;
                width: 180px;
                height: 300px;
                color : white;
            }

            /* Style the buttons inside the tab */
            .tab button 
            {
                display: block;
                color: black;
                padding: 22px 16px;
                width: 100%;
                border: none;
                outline: none;
                text-align: left;
                cursor: pointer;
                transition: 0.3s;
                font-size: 25px;
            }

            /* Change background color of buttons on hover */
            .tab button:hover 
            {
                outline: 2px dashed black;
            }

            /* Create an active/current "tab button" class */
            .tab button.active 
            {
                outline: 1px solid black;
                font-style: italic;
                font-weight: bold;
            }

            /* Style the tab content */
            .tabcontent 
            {
                float: left;
                padding-left: 20px;
                border-left: none;
                color:whitesmoke;
                display: flex;
            }

            h3
            {
                font-size: 50px;
            }

            p
            {
                font-size: 40px;
            }

            .multi
            {
                background-color: #5fec96;
            }

            .multivs
            {
                background-color: #f1fdf6;
            }

            .headsup
            {
                background-color: #e4ec6b;
            }
        </style>
    </head>

    <body>

    <div class="tab">
        <button class="tablinks multi" onclick="openRange(event, 'BU')" id="defaultOpen">BTN</button>
        <button class="tablinks multi" onclick="openRange(event, 'SB')">SB</button>
        <button class="tablinks multi" onclick="openRange(event, 'BB')">BB</button>
        <button class="tablinks multivs" onclick="openRange(event, 'SBvBU')">SB vs BTN</button>
        <button class="tablinks headsup" onclick="openRange(event, 'HU_SB')">HU SB</button>
        <button class="tablinks headsup"  onclick="openRange(event, 'HU_BB')">HU BB</button>
    </div>

    <div id="BU" class="tabcontent">
    <h3>BTN</h3>
    <p>MA J9</p>
    <p>AX T8</p>
    <p>AK 98</p>
    </div>

    <div id="SB" class="tabcontent">
    <h3>SB</h3>
    <p>MA J9</p>
    <p>AX T8</p>
    <p>AK 98</p>
    </div>

    <div id="BB" class="tabcontent">
    <h3>BB</h3>
    <p>MA J9</p>
    <p>AX T8</p>
    <p>AK 98</p>
    </div>

    <div id="SBvBU" class="tabcontent">
    <h3>SB vs BTN</h3>
    <p>MA J9</p>
    <p>AX T8</p>
    <p>AK 98</p>
    </div>

    <div id="HU_SB" class="tabcontent">
    <h3>HU SB</h3>
    <p>MA J9</p>
    <p>AX T8</p>
    <p>AK 98</p>
    </div>

    <div id="HU_BB" class="tabcontent">
    <h3>HU BB</h3>
    <p>MA J9</p>
    <p>AX T8</p>
    <p>AK 98</p>
    </div>

    <script>
    function openRange(evt, rangeName) 
    {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) 
        {
            tabcontent[i].style.display = "none";
        }

        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) 
        {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        
        document.getElementById(rangeName).style.display = "block";
        evt.currentTarget.className += " active";
    }

    // Get the element with id="defaultOpen" and click on it
    document.getElementById("defaultOpen").click();
    </script>
    
    </body>
</html>
